version: "3.8"

services:
  purostill-frontend:
    container_name: purostill-frontend
    build:
      context: .
      dockerfile: Dockerfile
      args:
        WORDPRESS_GRAPHQL_URL: https://backend-ps.purostill.com/graphql
        WOOCOMMERCE_URL: https://backend-ps.purostill.com
    restart: always
    environment:
      - NODE_ENV=production
      - WORDPRESS_GRAPHQL_URL=https://backend-ps.purostill.com/graphql
      - PORT=3000
      - HOSTNAME=0.0.0.0
    expose:
      - "3000"
    networks:
      - caddy_net

networks:
  caddy_net:
    external: true
